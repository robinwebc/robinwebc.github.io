<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found — Robin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ece8ff">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/home.css">
  <script>
    try {
      var savedLang = localStorage.getItem("robin-lang");
      if (savedLang === "en" || savedLang === "bn") {
        document.documentElement.setAttribute("data-lang", savedLang);
        document.documentElement.lang = savedLang;
      }
      var savedTheme = localStorage.getItem("robin-theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    } catch (e) {}
  </script>
</head>
<body data-title-bn="পাতা নেই — রবিন" data-title-en="Page not found — Robin">
  <div class="bg" aria-hidden="true"><div class="gridlines"></div></div>
  <main class="missing">
    <div>
      <p class="kicker">404</p>
      <h1>
        <span class="lang-bn" lang="bn">পাতা নেই</span>
        <span class="lang-en" lang="en">Page not found</span>
      </h1>
      <p>
        <span class="lang-bn" lang="bn">এই ঠিকানায় কিছু নেই।</span>
        <span class="lang-en" lang="en">There is nothing at this address.</span>
      </p>
      <div class="cta">
        <a class="btn btn-gh" href="/"><span class="lang-bn" lang="bn">রবিন</span><span class="lang-en" lang="en">Robin</span></a>
        <a class="btn btn-gh" href="/payzma/">Payzma</a>
      </div>
    </div>
  </main>
  <script src="/js/lang.js"></script>
</body>
</html>
