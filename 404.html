<!DOCTYPE html>
<html lang="bn" data-lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>পাতা নেই — রবিন</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6e241c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,560;1,560&family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/home.css">
  <script>
    try {
      var saved = localStorage.getItem("robin-lang");
      if (saved === "en" || saved === "bn") {
        document.documentElement.setAttribute("data-lang", saved);
        document.documentElement.lang = saved;
      }
    } catch (e) {}
  </script>
</head>
<body data-title-bn="পাতা নেই — রবিন" data-title-en="Page not found — Robin">
  <div class="shell">
    <header class="mast">
      <div class="mast-top">
        <p class="place">
          <span class="lang-bn" lang="bn">৪০৪</span>
          <span class="lang-en" lang="en">404</span>
        </p>
        <div class="lang" role="group">
          <button type="button" data-lang-set="bn" lang="bn" aria-pressed="true">বাংলা</button>
          <button type="button" data-lang-set="en" lang="en" aria-pressed="false">English</button>
        </div>
      </div>
      <h1>
        <span class="lang-bn" lang="bn">নেই</span>
        <span class="lang-en" lang="en">Missing</span>
      </h1>
      <p class="role">
        <span class="lang-bn" lang="bn">এই ঠিকানায় পাতা নেই।</span>
        <span class="lang-en" lang="en">There is no page at this address.</span>
      </p>
    </header>
    <main class="sheet" id="content">
      <section>
        <h2>
          <span class="lang-bn" lang="bn">ফিরে যান</span>
          <span class="lang-en" lang="en">Go back</span>
        </h2>
        <ul class="links">
          <li><a href="/"><span class="lang-bn" lang="bn">রবিন</span><span class="lang-en" lang="en">Robin</span></a></li>
          <li><a href="/daqbank/"><span class="lang-bn" lang="bn">ডাকব্যাংক</span><span class="lang-en" lang="en">DaqBank</span></a></li>
        </ul>
      </section>
    </main>
  </div>
  <script src="/js/lang.js"></script>
</body>
</html>
